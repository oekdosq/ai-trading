# nginx reverse proxy → uvicorn (127.0.0.1:8000)
# Salin ke /etc/nginx/sites-available/ai-trading lalu symlink ke sites-enabled.
# Ganti server_name dengan domain/IP kamu.
server {
    listen 80;
    server_name _;   # ganti dgn domain kamu

    location /static/ {
        alias /home/ubuntu/ai-trading/app/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
